<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #080b12, #111827);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid #263244;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    header {
      padding: 20px 25px;
      border-bottom: 1px solid #263244;
      background: #111827;
    }

    header h1 {
      font-size: 22px;
    }

    header p {
      color: #9ca3af;
      margin-top: 5px;
      font-size: 14px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      max-width: 80%;
      padding: 15px 18px;
      border-radius: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
      border-bottom-right-radius: 4px;
    }

    .bot {
      align-self: flex-start;
      background: #1f2937;
      border: 1px solid #374151;
      border-bottom-left-radius: 4px;
    }

    .typing {
      color: #9ca3af;
      font-style: italic;
    }

    .input-area {
      padding: 18px;
      border-top: 1px solid #263244;
      background: #111827;
    }

    .input-box {
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 55px;
      max-height: 150px;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #374151;
      background: #0f172a;
      color: white;
      outline: none;
      font-size: 15px;
    }

    textarea:focus {
      border-color: #3b82f6;
    }

    button {
      width: 110px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .welcome {
      text-align: center;
      color: #9ca3af;
      margin: auto;
    }

    .welcome h2 {
      color: white;
      margin-bottom: 8px;
    }

    @media (max-width: 600px) {
      .container {
        height: 95vh;
      }

      .message {
        max-width: 90%;
      }

      button {
        width: 80px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>🤖 AI Assistant</h1>
      <p>Faça uma pergunta e receba uma resposta completa.</p>
    </header>

    <main id="chat">

      <div class="welcome">
        <h2>Olá! 👋</h2>
        <p>Digite uma pergunta abaixo para começar.</p>
      </div>

    </main>

    <div class="input-area">
      <div class="input-box">

        <textarea
          id="question"
          placeholder="Digite sua pergunta..."
          onkeydown="handleKey(event)"
        ></textarea>

        <button id="sendButton" onclick="sendQuestion()">
          Enviar
        </button>

      </div>
    </div>

  </div>

  <script>

    const chat = document.getElementById("chat");
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = `message ${type}`;

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    function handleKey(event) {

      if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendQuestion();

      }
    }

    async function sendQuestion() {

      const question = questionInput.value.trim();

      if (!question) {
        return;
      }

      // Remove mensagem inicial
      const welcome = document.querySelector(".welcome");

      if (welcome) {
        welcome.remove();
      }

      addMessage(question, "user");

      questionInput.value = "";

      sendButton.disabled = true;

      const typing = addMessage("IA está pensando...", "bot");

      typing.classList.add("typing");

      try {

        /*
          AQUI É ONDE O FRONTEND ENVIA A PERGUNTA
          PARA O SEU BACKEND.

          Seu backend deve receber:

          {
            "question": "pergunta do usuário"
          }

          E retornar:

          {
            "answer": "resposta da IA"
          }
        */

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            question: question
          })

        });

        if (!response.ok) {
          throw new Error("Erro ao consultar a IA.");
        }

        const data = await response.json();

        typing.remove();

        addMessage(
          data.answer || "Não foi possível gerar uma resposta.",
          "bot"
        );

      } catch (error) {

        typing.remove();

        addMessage(
          "Não consegui conectar ao servidor da IA. Verifique se o backend está funcionando.",
          "bot"
        );

        console.error(error);

      } finally {

        sendButton.disabled = false;

        questionInput.focus();

      }
    }

  </script>

</body>
</html>
